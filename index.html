<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evia</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#ffb300" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Evia" />
<style>
  :root {
    --bg: #ffffff;
    --orb-a: #ffe14d;
    --orb-b: #ffb300;
    --eye: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #dock {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    transform-origin: top left;
    transform: scale(1);
    cursor: pointer;
    user-select: none;
    transition:
      top 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      left 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      margin 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #dock.docked {
    top: 20px;
    left: 20px;
    margin: 0;
    transform: scale(0.55);
  }

  /* one-time pop-in when the page first loads */
  .reveal {
    width: 100%;
    height: 100%;
    position: relative;
    animation: orb-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* a yellow puddle-drop ripple bursts from behind her as she appears */
  .flash-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1px;
    height: 1px;
    z-index: 0;
    pointer-events: none;
  }

  .ripple {
    position: absolute;
    top: 0;
    left: 0;
    width: 70px;
    height: 70px;
    margin: -35px 0 0 -35px;
    border-radius: 50%;
    border: 4px solid var(--orb-b);
    opacity: 0;
    animation: ripple-out 1.15s ease-out forwards;
  }

  .ripple.r2 {
    animation-delay: 0.16s;
  }

  .ripple.r3 {
    animation-delay: 0.32s;
  }

  .flash-core {
    position: absolute;
    top: 0;
    left: 0;
    width: 60px;
    height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8dd 0%, var(--orb-a) 55%, var(--orb-b) 100%);
    animation: flash-core-out 0.55s ease-out forwards;
  }

  .orb-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  .floater {
    width: 100%;
    height: 100%;
    animation: float 3.4s ease-in-out infinite;
  }

  .tilter {
    width: 100%;
    height: 100%;
  }

  .tilter.pop {
    animation: pop 0.6s ease-out;
  }

  .tilter.tilt {
    animation: tilt 0.9s ease-in-out;
  }

  .tilter.shake {
    animation: shake 0.6s ease-in-out;
  }

  .tilter.nod {
    animation: nod 0.7s ease-in-out;
  }

  .orb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff2a8 0%, var(--orb-a) 32%, var(--orb-b) 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: breathe 3.4s ease-in-out infinite, glow 4.8s ease-in-out infinite;
    box-shadow:
      inset -7px -7px 16px rgba(0, 0, 0, 0.18),
      inset 5px 5px 12px rgba(255, 255, 255, 0.35),
      0 8px 24px rgba(255, 179, 0, 0.35);
  }

  .face {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: transform 0.25s ease;
  }

  .face.look-left {
    transform: translateX(-7px);
  }

  .face.look-right {
    transform: translateX(7px);
  }

  .face.think {
    animation: ponder 2.6s ease-in-out infinite;
  }

  .face.roll {
    animation: eye-roll 0.9s ease-in-out;
  }

  .eye-group {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .brow {
    width: 16px;
    height: 4px;
    border-radius: 2px;
    background: var(--eye);
    opacity: 0;
    transform: translateY(4px) rotate(0deg);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .brow.raise {
    opacity: 1;
    transform: translateY(-3px) rotate(0deg);
  }

  .brow.furrow {
    opacity: 1;
    transform: translateY(1px) rotate(-14deg);
  }

  .eye {
    background: var(--eye);
    transition: width 0.18s ease, height 0.18s ease, border-radius 0.18s ease, transform 0.18s ease;
  }

  .eye.normal {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    transform: scaleY(1);
  }

  .eye.closed {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    transform: scaleY(0.08);
  }

  .eye.happy {
    width: 26px;
    height: 15px;
    border-radius: 50% 50% 0 0;
    transform: scaleY(1);
  }

  .eye.wide {
    width: 27px;
    height: 34px;
    border-radius: 50%;
    transform: scaleY(1);
  }

  .eye.sleepy {
    width: 20px;
    height: 8px;
    border-radius: 4px;
    transform: scaleY(1);
  }

  #bubble {
    position: fixed;
    top: 10px;
    left: 84px;
    right: 16px;
    background: #ffffff;
    border: 2px solid #b8b8b8;
    border-radius: 14px;
    padding: 10px 13px;
    font-size: 13px;
    line-height: 1.4;
    color: #4a3200;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    opacity: 0;
    transform: scale(0.8);
    transform-origin: left center;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 2;
  }

  #bubble.show {
    opacity: 1;
    transform: scale(1);
  }

  #bubble::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 22px;
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 9px solid #b8b8b8;
  }

  #bubble::after {
    content: "";
    position: absolute;
    left: -7px;
    top: 23px;
    width: 0;
    height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-right: 8px solid #ffffff;
  }

  .bubble-word {
    display: inline-block;
    white-space: nowrap;
  }

  .talk-letter {
    display: inline-block;
    opacity: 0;
    animation: letter-talk 0.5s ease forwards;
  }

  /* Course pack pills, below the docked orb — same bubble styling,
     as individual pill-shaped buttons rather than one text box */
  #packWrap {
    position: fixed;
    top: 90px;
    left: 20px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 220px;
  }

  .pack-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #ffffff;
    border: 2px solid #b8b8b8;
    border-radius: 999px;
    padding: 9px 8px 9px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #4a3200;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    cursor: pointer;
  }

  .pack-pill.show {
    opacity: 1;
    transform: translateX(0);
  }

  .pack-pill .pack-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pack-pill .pack-remove {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: none;
    color: #b8b8b8;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pack-pill .pack-remove:active {
    background: #f0f0f0;
    color: #888888;
  }

  /* QR scanner overlay */
  #scannerOverlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
  }

  #scannerOverlay.open {
    display: flex;
  }

  #scannerBox {
    position: relative;
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #111111;
  }

  #scannerVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #scannerBox .scan-frame {
    position: absolute;
    inset: 14%;
    border: 3px solid var(--orb-a);
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.25);
  }

  #scannerStatus {
    color: #ffffff;
    font-size: 14px;
    text-align: center;
    max-width: 300px;
    margin: 0;
  }

  #scannerCancel {
    background: #ffffff;
    color: #333333;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .shadow {
    position: absolute;
    bottom: -12px;
    left: 50%;
    width: 70%;
    height: 10px;
    background: radial-gradient(ellipse at center, rgba(255, 179, 0, 0.3) 0%, rgba(255, 179, 0, 0) 70%);
    transform: translateX(-50%);
    border-radius: 50%;
    animation: shadow-pulse 3.4s ease-in-out infinite;
  }

  @keyframes orb-in {
    0% { opacity: 0; transform: scale(0.25); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes letter-talk {
    0%   { opacity: 0; transform: translateY(5px); }
    45%  { opacity: 1; transform: translateY(-3px); }
    75%  { transform: translateY(1px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes ripple-out {
    0%   { transform: scale(0.3); opacity: 0.75; border-width: 5px; }
    65%  { opacity: 0.3; }
    100% { transform: scale(3.4); opacity: 0; border-width: 1px; }
  }

  @keyframes flash-core-out {
    0%   { transform: scale(0.2); opacity: 0.9; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }

  @keyframes glow {
    0%, 100% {
      box-shadow:
        inset -7px -7px 16px rgba(0, 0, 0, 0.18),
        inset 5px 5px 12px rgba(255, 255, 255, 0.35),
        0 8px 24px rgba(255, 179, 0, 0.35);
    }
    50% {
      box-shadow:
        inset -7px -7px 16px rgba(0, 0, 0, 0.18),
        inset 5px 5px 12px rgba(255, 255, 255, 0.35),
        0 8px 28px rgba(255, 179, 0, 0.45);
    }
  }

  @keyframes shadow-pulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.35; }
    50% { transform: translateX(-50%) scale(0.8); opacity: 0.18; }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    60% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }

  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-4deg); }
    75% { transform: rotate(4deg); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-2px); }
    40% { transform: translateX(2px); }
    60% { transform: translateX(-1.5px); }
    80% { transform: translateX(1.5px); }
  }

  @keyframes nod {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(1.5px) rotate(-1.5deg); }
    60% { transform: translateY(0) rotate(1deg); }
  }

  @keyframes ponder {
    0%, 100% { transform: translate(0, -3px); }
    50% { transform: translate(3px, -3px); }
  }

  @keyframes eye-roll {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-3px, -2.5px); }
    50%  { transform: translate(0, -4px); }
    75%  { transform: translate(3px, -2.5px); }
    100% { transform: translate(0, 0); }
  }

  /* A discreet pull-tab at the bottom edge, tap or swipe up to reveal
     the options sheet. Only appears once Evia is docked in the corner. */
  #sheetHandle {
    position: fixed;
    bottom: 0;
    left: 50%;
    width: 64px;
    height: 26px;
    margin-left: -32px;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  #sheetHandle.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  #sheetHandle .grip {
    width: 40px;
    height: 5px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.18);
    transition: background 0.2s ease, transform 0.2s ease;
  }

  #sheetHandle:active .grip,
  #sheetHandle.dragging .grip {
    background: rgba(0, 0, 0, 0.3);
    transform: scaleX(1.15);
  }

  #sheetBlur {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 40;
  }

  #sheetBlur.show {
    opacity: 1;
    pointer-events: auto;
  }

  #sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 51;
    background: #ffffff;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.14);
    padding: 10px 0 max(10px, env(safe-area-inset-bottom, 10px));
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  }

  #sheet.open {
    transform: translateY(0);
  }

  #sheet .grip {
    width: 36px;
    height: 5px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.15);
    margin: 0 auto 6px;
  }

  .sheet-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 20px;
    background: none;
    border: none;
    border-top: 1px solid #efefef;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }

  .sheet-row:first-of-type {
    border-top: none;
  }

  .sheet-row:active {
    background: #f7f7f7;
  }

  .sheet-row .row-icon {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #8a8a8a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sheet-row .row-label {
    font-size: 15px;
    font-weight: 600;
    color: #333333;
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .flash-ring, .ripple, .flash-core, .floater, .orb, .shadow,
    .tilter.pop, .tilter.tilt, .tilter.shake, .tilter.nod,
    .face.think, .face.roll {
      animation: none;
    }
    .reveal { opacity: 1; transform: none; }
    .ripple, .flash-core { opacity: 0; }
    #bubble { transition: none; }
    .talk-letter { animation: none; opacity: 1; }
    .pack-pill { transition: none; }
  }
</style>
</head>
<body>
  <div id="dock">
    <div class="reveal">
      <div class="flash-ring">
        <span class="flash-core"></span>
        <span class="ripple r1"></span>
        <span class="ripple r2"></span>
        <span class="ripple r3"></span>
      </div>
      <div class="orb-wrap">
        <div class="floater">
          <div class="tilter" id="tilter">
            <div class="orb">
              <div class="face" id="face">
                <div class="eye-group">
                  <div class="brow left" id="browL"></div>
                  <div class="eye left normal" id="eyeL"></div>
                </div>
                <div class="eye-group">
                  <div class="brow right" id="browR"></div>
                  <div class="eye right normal" id="eyeR"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="shadow"></div>
      </div>
    </div>
  </div>

  <div id="bubble">
    <span id="bubbleText"></span>
  </div>

  <div id="packWrap"></div>

  <div id="scannerOverlay">
    <div id="scannerBox">
      <video id="scannerVideo" playsinline autoplay muted></video>
      <div class="scan-frame"></div>
    </div>
    <p id="scannerStatus">Point your camera at a Naxos v2 course-pack QR code…</p>
    <button id="scannerCancel">Cancel</button>
  </div>
  <canvas id="scannerCanvas" style="display:none;"></canvas>

  <div id="sheetBlur"></div>

  <div id="sheetHandle" aria-label="Open options" role="button" tabindex="0">
    <span class="grip"></span>
  </div>

  <div id="sheet" role="dialog" aria-label="Options">
    <span class="grip"></span>

    <button class="sheet-row" id="rowChat">
      <span class="row-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 5.5C4 4.67 4.67 4 5.5 4h13c.83 0 1.5.67 1.5 1.5v9c0 .83-.67 1.5-1.5 1.5H9l-4 3.5v-3.5H5.5C4.67 16 4 15.33 4 14.5v-9z" fill="#ffffff"/>
        </svg>
      </span>
      <span class="row-label">Chat</span>
    </button>

    <button class="sheet-row" id="rowQr">
      <span class="row-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1" fill="#ffffff"/>
          <rect x="14" y="3" width="7" height="7" rx="1" fill="#ffffff"/>
          <rect x="3" y="14" width="7" height="7" rx="1" fill="#ffffff"/>
          <rect x="14" y="14" width="3" height="3" rx="0.5" fill="#ffffff"/>
          <rect x="18" y="14" width="3" height="3" rx="0.5" fill="#ffffff"/>
          <rect x="14" y="18" width="3" height="3" rx="0.5" fill="#ffffff"/>
          <rect x="18" y="18" width="3" height="3" rx="0.5" fill="#ffffff"/>
        </svg>
      </span>
      <span class="row-label">QR Code</span>
    </button>

    <button class="sheet-row" id="rowOptions">
      <span class="row-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="6" cy="7" r="2.2" fill="#ffffff"/>
          <rect x="10" y="6.2" width="10" height="1.6" rx="0.8" fill="#ffffff"/>
          <circle cx="18" cy="13" r="2.2" fill="#ffffff"/>
          <rect x="4" y="12.2" width="10" height="1.6" rx="0.8" fill="#ffffff"/>
          <circle cx="9" cy="19" r="2.2" fill="#ffffff"/>
          <rect x="13" y="18.2" width="7" height="1.6" rx="0.8" fill="#ffffff"/>
        </svg>
      </span>
      <span class="row-label">Options</span>
    </button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dock = document.getElementById('dock');
  var face = document.getElementById('face');
  var eyeL = document.getElementById('eyeL');
  var eyeR = document.getElementById('eyeR');
  var browL = document.getElementById('browL');
  var browR = document.getElementById('browR');
  var tilter = document.getElementById('tilter');
  var bubble = document.getElementById('bubble');
  var bubbleText = document.getElementById('bubbleText');
  var sheetHandle = document.getElementById('sheetHandle');
  var packWrap = document.getElementById('packWrap');

  // --- Course packs, imported via QR code from Naxos v2 ---
  var COURSE_PACKS_KEY = 'evia-course-packs';

  function loadCoursePacks() {
    try {
      var raw = localStorage.getItem(COURSE_PACKS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveCoursePacks(packs) {
    try {
      localStorage.setItem(COURSE_PACKS_KEY, JSON.stringify(packs));
    } catch (e) {
      // storage unavailable (private browsing, etc.) — packs just won't persist
    }
  }

  var coursePacks = loadCoursePacks();

  function renderCoursePacks() {
    packWrap.innerHTML = '';
    coursePacks.forEach(function (pack, idx) {
      var pill = document.createElement('div');
      pill.className = 'pack-pill';
      pill.style.transitionDelay = (idx * 70) + 'ms';

      var name = document.createElement('span');
      name.className = 'pack-name';
      name.textContent = pack.name;
      pill.appendChild(name);

      var removeBtn = document.createElement('button');
      removeBtn.className = 'pack-remove';
      removeBtn.setAttribute('aria-label', 'Remove ' + pack.name);
      removeBtn.textContent = '\u00D7';
      removeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        coursePacks = coursePacks.filter(function (p) {
          return p.id !== pack.id;
        });
        saveCoursePacks(coursePacks);
        renderCoursePacks();
      });
      pill.appendChild(removeBtn);

      packWrap.appendChild(pill);
    });
  }

  function showCoursePacks() {
    renderCoursePacks();
    requestAnimationFrame(function () {
      packWrap.querySelectorAll('.pack-pill').forEach(function (p) {
        p.classList.add('show');
      });
    });
  }

  function hideCoursePacks() {
    packWrap.querySelectorAll('.pack-pill').forEach(function (p) {
      p.classList.remove('show');
    });
  }

  function addCoursePack(name) {
    var trimmed = (name || '').trim();
    if (!trimmed) return;
    coursePacks.push({ id: 'pack-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), name: trimmed });
    saveCoursePacks(coursePacks);
    if (docked) {
      showCoursePacks();
    }
  }

  var BUBBLE_MESSAGE = 'Which of the jobs below are you working on today?';
  var bubbleTimer = null;
  var fabVisibilityTimer = null;
  var packTimer = null;

  function buildBubbleText(message) {
    bubbleText.innerHTML = '';
    var words = message.split(' ');
    var globalIndex = 0;

    words.forEach(function (word, wIdx) {
      var wordSpan = document.createElement('span');
      wordSpan.className = 'bubble-word';

      for (var c = 0; c < word.length; c++) {
        var letter = document.createElement('span');
        letter.className = 'talk-letter';
        letter.textContent = word[c];
        letter.style.animationDelay = (globalIndex * 22) + 'ms';
        wordSpan.appendChild(letter);
        globalIndex++;
      }

      bubbleText.appendChild(wordSpan);

      if (wIdx < words.length - 1) {
        // a plain breakable space between word spans, so wrapping only
        // ever happens between words, never inside one
        bubbleText.appendChild(document.createTextNode(' '));
        globalIndex++;
      }
    });
  }

  // Each step describes a short "beat" of personality:
  // eyes: shape for both eyes | eyeL/eyeR: shape for one eye only (wink)
  // brow: shape for both brows | browL/browR: shape for one brow only
  // face: look-left / look-right / roll (a playful eye-roll)
  // orb: pop / tilt / shake / nod, a matching flourish on the whole orb
  var sequence = [
    { duration: 3200 },
    { duration: 220,  eyes: 'closed' },                                   // blink
    { duration: 3600 },
    { duration: 1000, eyes: 'happy', orb: 'tilt' },                        // happy
    { duration: 4200 },
    { duration: 400,  eyeL: 'closed' },                                    // wink left
    { duration: 4000 },
    { duration: 220,  eyes: 'closed' },                                    // blink
    { duration: 3400 },
    { duration: 800,  eyes: 'wide', brow: 'raise', orb: 'pop' },           // surprised
    { duration: 4500 },
    { duration: 700,  face: 'look-left' },
    { duration: 700,  face: 'look-right' },
    { duration: 4000 },
    { duration: 2200, eyes: 'sleepy' },                                    // sleepy
    { duration: 4000 },
    { duration: 900,  browR: 'raise', orb: 'nod' },                        // skeptical / one eyebrow up
    { duration: 4200 },
    { duration: 220,  eyes: 'closed' },                                    // blink
    { duration: 3600 },
    { duration: 500,  eyeR: 'closed' },                                    // wink right
    { duration: 4200 },
    { duration: 900,  eyes: 'happy', orb: 'shake' },                       // laughing
    { duration: 4500 },
    { duration: 900,  face: 'roll' },                                      // eye-roll
    { duration: 4200 }
  ];

  var i = 0;
  var loopTimer = null;
  var docked = false;

  function applyStep(step) {
    var eyeLClass = step.eyes || step.eyeL || 'normal';
    var eyeRClass = step.eyes || step.eyeR || 'normal';
    eyeL.className = 'eye left ' + eyeLClass;
    eyeR.className = 'eye right ' + eyeRClass;

    var browLClass = step.brow || step.browL || '';
    var browRClass = step.brow || step.browR || '';
    browL.className = 'brow left' + (browLClass ? ' ' + browLClass : '');
    browR.className = 'brow right' + (browRClass ? ' ' + browRClass : '');

    var faceClass = step.face && step.face !== 'roll' ? ' ' + step.face : '';
    face.className = 'face' + faceClass;
    if (step.face === 'roll') {
      void face.offsetWidth; // restart the eye-roll animation
      face.classList.add('roll');
    }

    tilter.classList.remove('pop', 'tilt', 'shake', 'nod');
    if (step.orb) {
      void tilter.offsetWidth; // restart animation even if same class as before
      tilter.classList.add(step.orb);
    }
  }

  function loop() {
    var step = sequence[i % sequence.length];
    applyStep(step);
    i++;
    loopTimer = setTimeout(loop, step.duration);
  }

  function stopLoop() {
    clearTimeout(loopTimer);
  }

  dock.addEventListener('click', function () {
    docked = !docked;

    if (docked) {
      stopLoop();
      tilter.classList.remove('pop', 'tilt', 'shake', 'nod');
      eyeL.className = 'eye left normal';
      eyeR.className = 'eye right normal';
      browL.className = 'brow left';
      browR.className = 'brow right';
      face.className = 'face think';
      dock.classList.add('docked');

      clearTimeout(bubbleTimer);
      buildBubbleText(BUBBLE_MESSAGE);
      var revealDelay = reduceMotion ? 0 : 650;
      bubbleTimer = setTimeout(function () {
        bubble.classList.add('show');
      }, revealDelay);

      clearTimeout(fabVisibilityTimer);
      fabVisibilityTimer = setTimeout(function () {
        sheetHandle.classList.add('visible');
      }, revealDelay);

      clearTimeout(packTimer);
      packTimer = setTimeout(function () {
        if (coursePacks.length > 0) {
          showCoursePacks();
        }
      }, revealDelay);
    } else {
      dock.classList.remove('docked');
      face.className = 'face';
      clearTimeout(bubbleTimer);
      bubble.classList.remove('show');

      clearTimeout(fabVisibilityTimer);
      sheetHandle.classList.remove('visible');
      if (typeof setSheetOpen === 'function') {
        setSheetOpen(false);
      }

      clearTimeout(packTimer);
      hideCoursePacks();

      if (!reduceMotion) {
        loop();
      }
    }
  });

  if (!reduceMotion) {
    loop();
  }

  // --- Discreet bottom-sheet options drawer ---
  var sheet = document.getElementById('sheet');
  var sheetBlur = document.getElementById('sheetBlur');
  var sheetOpen = false;

  function setSheetOpen(open) {
    sheetOpen = open;
    sheet.classList.toggle('open', open);
    sheetBlur.classList.toggle('show', open);
    sheetHandle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  sheetHandle.addEventListener('click', function () {
    setSheetOpen(!sheetOpen);
  });

  sheetHandle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setSheetOpen(!sheetOpen);
    }
  });

  sheetBlur.addEventListener('click', function () {
    setSheetOpen(false);
  });

  document.querySelectorAll('.sheet-row').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setSheetOpen(false);
      if (btn.id === 'rowQr') {
        openScanner();
      }
      // hook up real navigation/actions for the other rows here, e.g.:
      // if (btn.id === 'rowChat') { ... }
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetOpen) {
      setSheetOpen(false);
    }
  });

  // Swipe up on the handle (or down on the sheet's own grip) to toggle.
  function addSwipe(el, onSwipeUp, onSwipeDown) {
    var startY = null;

    el.addEventListener('touchstart', function (e) {
      startY = e.touches[0].clientY;
      el.classList.add('dragging');
    }, { passive: true });

    el.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      var dy = e.touches[0].clientY - startY;
      if (Math.abs(dy) > 6) {
        e.preventDefault();
      }
    }, { passive: false });

    el.addEventListener('touchend', function (e) {
      el.classList.remove('dragging');
      if (startY === null) return;
      var endY = e.changedTouches[0].clientY;
      var dy = endY - startY;
      if (dy < -24 && onSwipeUp) onSwipeUp();
      if (dy > 24 && onSwipeDown) onSwipeDown();
      startY = null;
    });
  }

  addSwipe(sheetHandle, function () { setSheetOpen(true); }, function () { setSheetOpen(false); });
  addSwipe(sheet, null, function () { setSheetOpen(false); });

  // --- QR scanner: imports a course pack from a Naxos v2 QR code ---
  var scannerOverlay = document.getElementById('scannerOverlay');
  var scannerVideo = document.getElementById('scannerVideo');
  var scannerCanvas = document.getElementById('scannerCanvas');
  var scannerStatus = document.getElementById('scannerStatus');
  var scannerCancel = document.getElementById('scannerCancel');
  var scannerCtx = scannerCanvas.getContext('2d', { willReadFrequently: true });
  var scannerStream = null;
  var scanning = false;

  function parseCoursePack(text) {
    try {
      var obj = JSON.parse(text);
      var name = obj.name || obj.title || obj.courseName || String(text).slice(0, 60);
      return name;
    } catch (e) {
      return String(text).slice(0, 60);
    }
  }

  function scanFrame() {
    if (!scanning) return;

    if (scannerVideo.readyState === scannerVideo.HAVE_ENOUGH_DATA && window.jsQR) {
      scannerCanvas.width = scannerVideo.videoWidth;
      scannerCanvas.height = scannerVideo.videoHeight;
      scannerCtx.drawImage(scannerVideo, 0, 0, scannerCanvas.width, scannerCanvas.height);
      var imageData = scannerCtx.getImageData(0, 0, scannerCanvas.width, scannerCanvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        var packName = parseCoursePack(code.data);
        addCoursePack(packName);
        closeScanner();
        return;
      }
    }
    requestAnimationFrame(scanFrame);
  }

  function openScanner() {
    scannerStatus.textContent = 'Point your camera at a Naxos v2 course-pack QR code…';
    scannerOverlay.classList.add('open');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      manualEntryFallback();
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function (stream) {
        scannerStream = stream;
        scannerVideo.srcObject = stream;
        scannerVideo.play();
        scanning = true;
        requestAnimationFrame(scanFrame);
      })
      .catch(function () {
        manualEntryFallback();
      });
  }

  function closeScanner() {
    scanning = false;
    scannerOverlay.classList.remove('open');
    if (scannerStream) {
      scannerStream.getTracks().forEach(function (track) {
        track.stop();
      });
      scannerStream = null;
    }
  }

  function manualEntryFallback() {
    closeScanner();
    var name = window.prompt('Camera unavailable. Enter the course pack name from Naxos v2:');
    if (name) {
      addCoursePack(name);
    }
  }

  scannerCancel.addEventListener('click', closeScanner);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && scannerOverlay.classList.contains('open')) {
      closeScanner();
    }
  });

  // Show any packs imported in a previous session if she's already docked
  // on load (not the normal case, but keeps state consistent).
  if (docked && coursePacks.length > 0) {
    showCoursePacks();
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        // installability still works without SW registration succeeding locally
      });
    });
  }
</script>
</body>
</html>
