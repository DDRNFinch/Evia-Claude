<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading Orb</title>
<style>
  :root {
    --bg: #ffffff;
    --orb-a: #ffe14d;
    --orb-b: #ffb300;
    --eye: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #dock {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    transform-origin: top left;
    transform: scale(1);
    cursor: pointer;
    user-select: none;
    transition:
      top 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      left 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      margin 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #dock.docked {
    top: 20px;
    left: 20px;
    margin: 0;
    transform: scale(0.55);
  }

  .orb-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .floater {
    width: 100%;
    height: 100%;
    animation: float 2.4s ease-in-out infinite;
  }

  .tilter {
    width: 100%;
    height: 100%;
  }

  .tilter.pop {
    animation: pop 0.6s ease-out;
  }

  .tilter.tilt {
    animation: tilt 0.9s ease-in-out;
  }

  .tilter.shake {
    animation: shake 0.6s ease-in-out;
  }

  .orb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff2a8 0%, var(--orb-a) 32%, var(--orb-b) 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: breathe 2.4s ease-in-out infinite, glow 3.6s ease-in-out infinite;
    box-shadow:
      inset -7px -7px 16px rgba(0, 0, 0, 0.18),
      inset 5px 5px 12px rgba(255, 255, 255, 0.35),
      0 8px 24px rgba(255, 179, 0, 0.35);
  }

  .face {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: transform 0.25s ease;
  }

  .face.look-left {
    transform: translateX(-6px);
  }

  .face.look-right {
    transform: translateX(6px);
  }

  .face.think {
    animation: ponder 2.6s ease-in-out infinite;
  }

  .eye {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 3px solid var(--eye);
    background: transparent;
    transition: width 0.18s ease, height 0.18s ease, border-width 0.18s ease, clip-path 0.18s ease, transform 0.18s ease;
  }

  .eye.normal {
    width: 16px;
    height: 16px;
    clip-path: none;
    transform: scaleY(1);
  }

  .eye.closed {
    width: 16px;
    height: 16px;
    clip-path: none;
    transform: scaleY(0.12);
  }

  .eye.happy {
    width: 18px;
    height: 18px;
    clip-path: inset(0 0 48% 0);
    transform: scaleY(1);
  }

  .eye.wide {
    width: 24px;
    height: 24px;
    border-width: 3.5px;
    clip-path: none;
    transform: scaleY(1);
  }

  .eye.sleepy {
    width: 16px;
    height: 16px;
    clip-path: inset(0 0 60% 0);
    transform: scaleY(1);
  }

  .shadow {
    position: absolute;
    bottom: -12px;
    left: 50%;
    width: 70%;
    height: 10px;
    background: radial-gradient(ellipse at center, rgba(255, 179, 0, 0.3) 0%, rgba(255, 179, 0, 0) 70%);
    transform: translateX(-50%);
    border-radius: 50%;
    animation: shadow-pulse 2.4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  @keyframes glow {
    0%, 100% {
      box-shadow:
        inset -7px -7px 16px rgba(0, 0, 0, 0.18),
        inset 5px 5px 12px rgba(255, 255, 255, 0.35),
        0 8px 24px rgba(255, 179, 0, 0.35);
    }
    50% {
      box-shadow:
        inset -7px -7px 16px rgba(0, 0, 0, 0.18),
        inset 5px 5px 12px rgba(255, 255, 255, 0.35),
        0 8px 34px rgba(255, 179, 0, 0.6);
    }
  }

  @keyframes shadow-pulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.35; }
    50% { transform: translateX(-50%) scale(0.8); opacity: 0.18; }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    30% { transform: scale(1.22); }
    60% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }

  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-9deg); }
    75% { transform: rotate(9deg); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  @keyframes ponder {
    0%, 100% { transform: translate(0, -3px); }
    50% { transform: translate(3px, -3px); }
  }

  #intro {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    pointer-events: none;
    animation: intro-out 1.3s ease forwards;
  }

  #intro::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    animation: white-flash 0.9s ease forwards;
  }

  #intro .flash-ring {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      #000000 0%, #000000 54%,
      #8f8f8f 54%, #8f8f8f 78%,
      #ffffff 78%, #ffffff 100%
    );
    animation: ring-flash 0.95s cubic-bezier(0.16, 0.84, 0.44, 1) forwards;
  }

  @keyframes ring-flash {
    0%   { transform: scale(0.25); opacity: 0; }
    30%  { transform: scale(1.1);  opacity: 1; }
    55%  { transform: scale(0.92); opacity: 1; }
    100% { transform: scale(1.6);  opacity: 0; }
  }

  @keyframes white-flash {
    0%   { opacity: 0; }
    12%  { opacity: 0.9; }
    30%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes intro-out {
    0%, 60% { opacity: 1; visibility: visible; }
    100% { opacity: 0; visibility: hidden; }
  }

  @media (prefers-reduced-motion: reduce) {
    #intro, #intro::before, #intro .flash-ring {
      animation: none;
      opacity: 0;
      visibility: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .floater, .orb, .shadow, .tilter.pop, .tilter.tilt, .tilter.shake, .face.think {
      animation: none;
    }
  }
</style>
</head>
<body>
  <div id="intro">
    <div class="flash-ring"></div>
  </div>

  <div id="dock">
    <div class="orb-wrap">
      <div class="floater">
        <div class="tilter" id="tilter">
          <div class="orb">
            <div class="face" id="face">
              <div class="eye left normal" id="eyeL"></div>
              <div class="eye right normal" id="eyeR"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>
  </div>

<script>
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dock = document.getElementById('dock');
  var face = document.getElementById('face');
  var eyeL = document.getElementById('eyeL');
  var eyeR = document.getElementById('eyeR');
  var tilter = document.getElementById('tilter');

  // Each step describes a few seconds of "personality":
  // eyes: shape applied to both eyes | eyeL/eyeR: shape for one eye only (wink)
  // face: look-left / look-right shifts both eyes sideways
  // orb: pop / tilt / shake, a matching flourish on the whole orb
  var sequence = [
    { duration: 1600 },
    { duration: 200,  eyes: 'closed' },                 // blink
    { duration: 1200 },
    { duration: 900,  eyes: 'happy', orb: 'tilt' },      // happy
    { duration: 1000 },
    { duration: 450,  eyeL: 'closed' },                  // wink left
    { duration: 1100 },
    { duration: 700,  eyes: 'wide', orb: 'pop' },        // surprised
    { duration: 900 },
    { duration: 650,  face: 'look-left' },
    { duration: 650,  face: 'look-right' },
    { duration: 800 },
    { duration: 1500, eyes: 'sleepy' },                  // sleepy
    { duration: 900 },
    { duration: 220,  eyes: 'closed' },                  // blink
    { duration: 500 },
    { duration: 600,  eyeR: 'closed' },                  // wink right
    { duration: 1000 },
    { duration: 700,  eyes: 'wide', orb: 'shake' },      // excited
    { duration: 1200 }
  ];

  var i = 0;
  var loopTimer = null;
  var docked = false;

  function applyStep(step) {
    var eyeLClass = step.eyes || step.eyeL || 'normal';
    var eyeRClass = step.eyes || step.eyeR || 'normal';
    eyeL.className = 'eye left ' + eyeLClass;
    eyeR.className = 'eye right ' + eyeRClass;
    face.className = 'face' + (step.face ? ' ' + step.face : '');

    tilter.classList.remove('pop', 'tilt', 'shake');
    if (step.orb) {
      void tilter.offsetWidth; // restart animation even if same class as before
      tilter.classList.add(step.orb);
    }
  }

  function loop() {
    var step = sequence[i % sequence.length];
    applyStep(step);
    i++;
    loopTimer = setTimeout(loop, step.duration);
  }

  function stopLoop() {
    clearTimeout(loopTimer);
  }

  dock.addEventListener('click', function () {
    docked = !docked;

    if (docked) {
      stopLoop();
      tilter.classList.remove('pop', 'tilt', 'shake');
      eyeL.className = 'eye left normal';
      eyeR.className = 'eye right normal';
      face.className = 'face think';
      dock.classList.add('docked');
    } else {
      dock.classList.remove('docked');
      face.className = 'face';
      if (!reduceMotion) {
        loop();
      }
    }
  });

  if (!reduceMotion) {
    loop();
  }
</script>
</body>
</html>
